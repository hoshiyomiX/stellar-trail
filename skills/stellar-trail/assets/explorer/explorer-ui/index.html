/* explorer-ui v4.4 style block — carried verbatim into the v5.0 miuix-vue app
 * (Task 53). Palette verbatim from compose-miuix-ui/miuix Colors.kt; D10 compact
 * typography 14/12/11px. Rules for miuix-replaced components go inert.
 * Source: assets/explorer/explorer-ui/index.html (v5.5.1 tree) */
/* ================================================================
   MIUIX (HyperOS) — Task Files Explorer UI v4.4 · zero-dependency
   (no CDN, no web font)
   Design system ported from compose-miuix-ui/miuix (Apache-2.0):
   the color roles below are VERBATIM from miuix-ui
   top.yukonga.miuix.kmp.theme/Colors.kt — lightColorScheme() and
   darkColorScheme() defaults. Component vocabulary: TopAppBar
   (frosted), Card (squircle surface), SmallTitle, SearchBar, TabRow
   chips, SuperArrow rows, Snackbar, FloatingActionButton, Dialog
   (windowDimming scrim). Type scale follows Miuix TextStyles,
   compact per the explorer's locked formatting decision.
   Adaptive: dark/light · desktop & mobile · a11y focus-visible.
   ================================================================ */

/* ---- Design tokens (non-color) --------------------------------- */
:root{
  /* Shape scale (squircle feel — generous radii) */
  --mx-radius-s:10px; --mx-radius-m:14px; --mx-radius-l:18px;
  --mx-radius-xl:22px; --mx-radius-full:999px;

  /* Motion — HyperOS standard + spring overshoot */
  --mx-dur:180ms; --mx-dur-med:280ms; --mx-dur-long:450ms;
  --mx-ease:cubic-bezier(.2,0,0,1);
  --mx-ease-spring:cubic-bezier(.34,1.56,.64,1);

  /* Type scale (Miuix TextStyles, compact) */
  --fs-appbar:17px;   /* MainTitle */
  --fs-section:13px;  /* SmallTitle */
  --fs-card:14px;     /* title3-ish */
  --fs-body:13px;     /* body1 */
  --fs-label:12px;    /* subtitle */
  --fs-caption:11px;  /* caption */

  --mx-font:system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",sans-serif;
  --mx-mono:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;

  --appbar-h:56px;
  --pad:clamp(14px,3vw,24px);
}

/* ---- DARK color scheme (default) — verbatim darkColorScheme() --- */
:root[data-theme="dark"]{
  color-scheme:dark;
  --mx-primary:#277AF7; --mx-on-primary:#FFFFFF;
  --mx-primary-container:#338FE4; --mx-on-primary-container:#FFFFFF;
  --mx-on-primary-variant:#99C7F1;
  --mx-tertiary-container:#2B3B54; --mx-on-tertiary-container:#4788FF;
  --mx-secondary-container:#434343; --mx-on-secondary-container:#7C7C7C;
  --mx-secondary-variant:#4F4F4F; --mx-on-secondary-variant:#959595;
  --mx-page:#242424;                 /* background */
  --mx-card:#000000;                 /* surface — HyperOS black cards */
  --mx-on-card:rgba(255,255,255,.90);/* onBackground */
  --mx-on-card-2:#F2F2F2;            /* onSurface */
  --mx-text-2:rgba(255,255,255,.60); /* onSurfaceVariantSummary */
  --mx-text-3:rgba(255,255,255,.40); /* onSurfaceVariantActions */
  --mx-text-dim:#737373;             /* onSurfaceContainerVariant */
  --mx-on-bg-variant:#787E96;        /* onBackgroundVariant — section titles */
  --mx-outline:#404040; --mx-divider:#393939;
  --mx-error:#F12522; --mx-error-container:#2E0603; --mx-on-error-container:#FFDAD6;
  --mx-scrim:rgba(0,0,0,.60);        /* windowDimming */
  --mx-appbar:rgba(36,36,36,.72);
  --mx-hover:rgba(255,255,255,.07); --mx-press:rgba(255,255,255,.045);
  --mx-shadow:0 1px 3px rgba(0,0,0,.45),0 4px 14px rgba(0,0,0,.30);
  --mx-shadow-lg:0 12px 40px rgba(0,0,0,.60);
  --mx-spinner:#4788FF;
  --mx-scroll:rgba(255,255,255,.14);
  /* per-type icon-tile accents (HyperOS settings-style tiles) */
  --t-doc-bg:#2B3B54;   --t-doc-fg:#4788FF;
  --t-pdf-bg:#3A1512;   --t-pdf-fg:#FF7B6B;
  --t-img-bg:#3A2140;   --t-img-fg:#C77DFF;
  --t-data-bg:#0F3A24;  --t-data-fg:#5DDF9B;
  --t-code-bg:#1E3348;  --t-code-fg:#7DB8FF;
  --t-pkg-bg:#2C2340;   --t-pkg-fg:#B39DFF;
  --t-office-bg:#3D3010;--t-office-fg:#FFC55C;
  --t-other-bg:#333333; --t-other-fg:#ABABAB;
}
/* ---- LIGHT color scheme — verbatim lightColorScheme() ------------ */
:root[data-theme="light"]{
  color-scheme:light;
  --mx-primary:#3482FF; --mx-on-primary:#FFFFFF;
  --mx-primary-container:#5D9BFF; --mx-on-primary-container:#FFFFFF;
  --mx-on-primary-variant:#AECDFF;
  --mx-tertiary-container:#EAF2FF; --mx-on-tertiary-container:#3482FF;
  --mx-secondary-container:#F0F0F0; --mx-on-secondary-container:#A9A9A9;
  --mx-secondary-variant:#F0F0F0; --mx-on-secondary-variant:#B2B2B2;
  --mx-page:#F7F7F7;                 /* surface — HyperOS gray page */
  --mx-card:#FFFFFF;                 /* surfaceContainer — white cards */
  --mx-on-card:rgba(0,0,0,.90);
  --mx-on-card-2:#000000;
  --mx-text-2:rgba(0,0,0,.60);
  --mx-text-3:rgba(0,0,0,.40);
  --mx-text-dim:#959595;
  --mx-on-bg-variant:#8C93B0;
  --mx-outline:#D9D9D9; --mx-divider:#E0E0E0;
  --mx-error:#E94634; --mx-error-container:#FDF6F4; --mx-on-error-container:#410002;
  --mx-scrim:rgba(0,0,0,.30);
  --mx-appbar:rgba(247,247,247,.72);
  --mx-hover:rgba(0,0,0,.045); --mx-press:rgba(0,0,0,.03);
  --mx-shadow:0 1px 2px rgba(0,0,0,.06),0 4px 14px rgba(0,0,0,.05);
  --mx-shadow-lg:0 12px 40px rgba(0,0,0,.16);
  --mx-spinner:#3482FF;
  --mx-scroll:rgba(0,0,0,.18);
  --t-doc-bg:#EAF2FF;   --t-doc-fg:#2E6FD8;
  --t-pdf-bg:#FDECE9;   --t-pdf-fg:#D63A28;
  --t-img-bg:#F3EAFB;   --t-img-fg:#8A46C9;
  --t-data-bg:#E4F7EC;  --t-data-fg:#1E8A4E;
  --t-code-bg:#E8F0FA;  --t-code-fg:#2E6FD8;
  --t-pkg-bg:#EFEAFB;   --t-pkg-fg:#6C4ECC;
  --t-office-bg:#FBF1DF;--t-office-fg:#B07610;
  --t-other-bg:#EFEFEF; --t-other-fg:#7A7A7A;
}

/* ---- Base ------------------------------------------------------ */
*{box-sizing:border-box;margin:0;padding:0}
html{scroll-behavior:smooth}
body{
  font-family:var(--mx-font);font-size:var(--fs-body);
  background:var(--mx-page);color:var(--mx-on-card);
  -webkit-font-smoothing:antialiased;text-rendering:optimizeLegibility;
  min-height:100vh;transition:background var(--mx-dur-med) var(--mx-ease);
}
::selection{background:var(--mx-primary);color:var(--mx-on-primary)}
a{color:var(--mx-primary);text-decoration:none}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
input{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--mx-primary);outline-offset:2px;border-radius:6px}
::-webkit-scrollbar{width:10px;height:10px}
::-webkit-scrollbar-thumb{background:var(--mx-scroll);border-radius:99px;border:2px solid transparent;background-clip:content-box}
::-webkit-scrollbar-track{background:transparent}
.mono{font-family:var(--mx-mono)}

/* ---- TopAppBar (frosted, Miuix) -------------------------------- */
.topappbar{
  position:sticky;top:0;z-index:60;height:var(--appbar-h);
  display:flex;align-items:center;gap:10px;padding:0 var(--pad);
  background:var(--mx-appbar);
  -webkit-backdrop-filter:blur(24px) saturate(1.8);backdrop-filter:blur(24px) saturate(1.8);
  border-bottom:1px solid transparent;
  transition:border-color var(--mx-dur-med) var(--mx-ease);
}
.topappbar.scrolled{border-bottom-color:var(--mx-divider)}
.appbar-logo{
  width:34px;height:34px;border-radius:11px;flex:none;display:grid;place-items:center;
  background:var(--mx-primary);color:var(--mx-on-primary);
  box-shadow:var(--mx-shadow);
}
.appbar-logo .ic{width:20px;height:20px;fill:currentColor}
.appbar-title{font-size:var(--fs-appbar);font-weight:650;letter-spacing:.1px;color:var(--mx-on-card-2)}
.appbar-sub{font-size:var(--fs-caption);color:var(--mx-on-bg-variant);margin-top:1px}
.appbar-spacer{flex:1}
.chip{
  display:inline-flex;align-items:center;gap:6px;height:30px;padding:0 12px;
  border-radius:var(--mx-radius-full);background:var(--mx-secondary-container);
  color:var(--mx-on-secondary-variant);font-size:var(--fs-label);font-weight:550;
  white-space:nowrap;
}
.chip .ic{width:14px;height:14px;fill:currentColor;flex:none}
.chip--primary{background:var(--mx-tertiary-container);color:var(--mx-on-tertiary-container)}
.chip--warn{background:var(--mx-error-container);color:var(--mx-on-error-container)}
.ic.spinning{animation:spin .8s linear infinite}
.iconbtn{
  width:38px;height:38px;border-radius:50%;display:grid;place-items:center;flex:none;
  color:var(--mx-on-card-2);transition:background var(--mx-dur) var(--mx-ease);
}
.iconbtn:hover{background:var(--mx-hover)}
.iconbtn:active{background:var(--mx-press)}
.iconbtn .ic{width:20px;height:20px;fill:currentColor}

/* ---- Layout ---------------------------------------------------- */
main{max-width:1280px;margin:0 auto;padding:18px var(--pad) 40px}
section{margin-bottom:26px}
.smalltitle{ /* Miuix SmallTitle */
  display:flex;align-items:center;gap:8px;margin:0 2px 10px;
  font-size:var(--fs-section);font-weight:600;color:var(--mx-on-bg-variant);
}
.smalltitle .ic{width:15px;height:15px;fill:currentColor;opacity:.9}
.smalltitle .note{font-weight:450;font-size:var(--fs-caption);color:var(--mx-text-3);margin-left:2px}

/* ---- Stat tiles (Miuix Card grid) ------------------------------ */
.statgrid{display:grid;gap:12px;grid-template-columns:repeat(auto-fit,minmax(210px,1fr))}
.statcard{
  background:var(--mx-card);border-radius:var(--mx-radius-xl);
  padding:16px 16px 14px;box-shadow:var(--mx-shadow);
  transition:transform var(--mx-dur-med) var(--mx-ease-spring),box-shadow var(--mx-dur-med) var(--mx-ease);
  position:relative;overflow:hidden;
}
.statcard:hover{transform:translateY(-2px);box-shadow:var(--mx-shadow-lg)}
.statcard .top{display:flex;align-items:center;gap:10px;margin-bottom:10px}
.statcard .k{font-size:var(--fs-label);font-weight:550;color:var(--mx-text-2);letter-spacing:.2px}
.statcard .v{font-size:26px;font-weight:700;line-height:1.15;color:var(--mx-on-card-2);
  font-variant-numeric:tabular-nums}
.statcard .s{font-size:var(--fs-caption);color:var(--mx-text-3);margin-top:5px;
  overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.tile40{
  width:40px;height:40px;border-radius:13px;display:grid;place-items:center;flex:none;
}
.tile40 .ic{width:22px;height:22px;fill:currentColor}
.tile40--primary{background:var(--mx-primary);color:var(--mx-on-primary)}
.tile40--doc{background:var(--t-doc-bg);color:var(--t-doc-fg)}
.tile40--data{background:var(--t-data-bg);color:var(--t-data-fg)}
.tile40--img{background:var(--t-img-bg);color:var(--t-img-fg)}
.gdot{display:inline-block;width:7px;height:7px;border-radius:50%;margin-right:6px;vertical-align:1px}
.gdot.on{background:#4AD66D;box-shadow:0 0 6px rgba(74,214,109,.7)}
.gdot.off{background:var(--mx-error)}
/* ---- Task rail (SuperArrow-style cards) — v4.1: horizontal scroll --- */
.taskrail{
  display:flex;gap:10px;overflow-x:auto;overscroll-behavior-x:contain;
  scroll-snap-type:x proximity;padding:2px 2px 8px;
}
.tcard{
  flex:0 0 min(320px,84vw);      /* v4.1: fixed-basis cards in a sideways rail */
  scroll-snap-align:start;
  background:var(--mx-card);border-radius:var(--mx-radius-l);
  padding:13px 14px;box-shadow:var(--mx-shadow);cursor:pointer;
  border:2px solid transparent;
  transition:transform var(--mx-dur-med) var(--mx-ease-spring),
             border-color var(--mx-dur) var(--mx-ease),
             box-shadow var(--mx-dur-med) var(--mx-ease);
}
.tcard:hover{transform:translateY(-2px)}
.tcard.active{border-color:var(--mx-primary)}
.tcard .th{display:flex;align-items:center;gap:7px;margin-bottom:6px}
.tcard .tid{font-size:var(--fs-label);font-weight:700;color:var(--mx-primary);letter-spacing:.4px}
.tcard .tick{width:14px;height:14px;fill:var(--mx-primary);flex:none}
.tcard .tt{   /* v4.1: FULL text — wraps to as many lines as needed (was line-clamp:2) */
  font-size:var(--fs-card);font-weight:550;color:var(--mx-on-card-2);line-height:1.42;
  overflow-wrap:break-word;word-break:break-word;
}

.empty .e{

.empty .e .ic{width:28px;height:28px;fill:currentColor}
.empty .t{font-size:var(--fs-card);font-weight:650;color:var(--mx-on-card-2)}

.modal{

/* ---- Snackbar --------------------------------------------------- */
.snackbar{
  position:fixed;left:50%;bottom:26px;z-index:120;transform:translate(-50%,80px);
  display:flex;align-items:center;gap:12px;max-width:min(560px,92vw);

/* ============================================================
   Task 54 — miuix integration patch layer (v5.6.0 amend, ref #53)
   The extracted v4.4 rules above target the hand-rolled DOM
   (.topappbar / .iconbtn / .fab). The miuix-vue component layer
   renders its own classes, so four v4.4 contracts silently
   no-opped after the migration:
     B1 .iconbtn .ic sizing      → .m-icon-button slot svg fell to
        the intrinsic 300×150 (Rescan/Theme giant; off-screen left
        on mobile via the absolute __actions row, protruding on
        desktop);
     B2 .fab fixed-corner spec   → .m-fab is consumer-positioned
        (inline-flex, relative) → giant in-flow FAB;
     B3 the @≤640px two-row header fit (Task 45) targeted
        .topappbar — dead on the miuix DOM, title squeezed ~99px;
     B4 .topappbar was sticky    → .m-top-app-bar is static.
   This layer re-points those contracts at the miuix DOM with the
   v4.4 values. D10 structure lock untouched (tiles / rail / type
   scale / no hero-bento).
   ============================================================ */

/* B1 — icon buttons: v4.4 .iconbtn geometry (40px base / 34px mobile, .ic 20px) */
.m-icon-button{width:40px;height:40px;flex:none}
.m-icon-button .ic{width:20px;height:20px;fill:currentColor}

/* B2 — FAB: v4.4 .fab geometry, fixed corner + iOS safe-area
   (min-width override needed: miuix ships min-width:60px, which beats width:48px) */
.m-fab{position:fixed;right:22px;bottom:calc(24px + env(safe-area-inset-bottom, 0px));z-index:80;width:48px;height:48px;min-width:48px;min-height:48px;flex:none}
.m-fab .ic{width:22px;height:22px;fill:currentColor}

/* B4 — sticky header (v4.4 contract: the bar stays pinned above the cards) */
.m-top-app-bar{position:sticky;top:0;z-index:60}

/* miuix actions row: v4.4 bar spacing was gap:10px — miuix ships gap:0
   (the version + clock chips render touching) */
.m-top-app-bar__actions{gap:10px}

/* title containment: miuix centers the in-flow title across the FULL row
   while nav/actions are absolute — with our wide actions row the centered
   title runs under the chips (measured: title 266-501 vs actions 375-752
   @768). The v4.4 bar was left-aligned: restore that (D10-faithful) and
   fence the title between the nav zone (padding-left) and the actions
   zone (padding-right), ellipsized. */
.m-top-app-bar__row{justify-content:flex-start}
.m-top-app-bar__title{flex:1;min-width:0;padding-left:64px;padding-right:404px;align-items:flex-start;text-align:left}
.m-top-app-bar__title .m-text{max-width:100%;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
@media (max-width:900px){
  /* the subtitle is a Task-53 miuix addition, not a D10 item — drop it
     before the title zone gets too narrow (641-900px band) */
  .m-top-app-bar__title .m-text--body2{display:none}
}

/* B3 — @≤640px two-row header fit on the miuix DOM (the Task-45 contract):
   row 1 = logo + truncating title, row 2 = compact buttons + chips,
   right-aligned; the absolute nav/actions go in-flow */
@media (max-width:640px){
  .m-top-app-bar__row{flex-wrap:wrap;min-height:auto;row-gap:8px;padding-bottom:8px;justify-content:flex-start}
  .m-top-app-bar__nav{position:static;order:1;height:auto}
  .m-top-app-bar__title{order:2;flex:1;max-width:none;height:auto;padding:0}
  .m-top-app-bar__actions{position:static;order:3;flex:1 1 100%;height:auto;padding-right:var(--pad);justify-content:flex-end;flex-wrap:wrap;row-gap:8px;gap:8px}
  /* min-width override needed: miuix ships min-width:40px, which beats width:34px */
  .m-icon-button{width:34px;height:34px;min-width:34px;min-height:34px}
  .m-icon-button .ic{width:20px;height:20px}
  .chip{height:28px;padding:0 10px}
}
