<!DOCTYPE html>
<html lang="id" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="color-scheme" content="dark light">
<title>Task Files Explorer — Dashboard</title>
<script>
/* Tema pra-paint (anti-FOUC): ikuti prefers-color-scheme selama user belum
   memilih manual — pilihan manual dipersist di localStorage kunci "exp-theme". */
(function(){try{var t=localStorage.getItem("exp-theme");
if(t!=="dark"&&t!=="light"){t=window.matchMedia&&window.matchMedia("(prefers-color-scheme: light)").matches?"light":"dark"}
document.documentElement.dataset.theme=t}catch(e){}})();

/* ================= util ================= */
const $=s=>document.querySelector(s),$$=s=>[...document.querySelectorAll(s)];
const esc=s=>String(s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const svg=n=>'<svg class="ic" aria-hidden="true"><use href="#i-'+n+'"/></svg>';
const strow=(h,cls)=>'<tr class="staterow"><td colspan="5"><div class="st '+(cls||"")+'">'+h+"</div></td></tr>";
const fmtSize=n=>{if(n<1024)return n+" B";const u=["KB","MB","GB","TB"];let i=-1;
  do{n/=1024;i++}while(n>=1024&&i<3);return(n>=100?n.toFixed(0):n.toFixed(1))+" "+u[i]};
const fmtDate=t=>new Date(t*1000).toLocaleString("id-ID",{dateStyle:"medium",timeStyle:"short"});
const fmtRel=t=>{const d=Date.now()/1000-t;   /* waktu relatif bahasa Indonesia */
  if(d<60)return"baru saja";
  if(d<3600)return Math.floor(d/60)+" mnt lalu";
  if(d<86400)return Math.floor(d/3600)+" jam lalu";
  if(d<604800)return Math.floor(d/86400)+" hr lalu";
  return fmtDate(t)};

/* ================= kategori & state ================= */
/* pdf digabung ke Dokumen; sisanya mengikuti field "type" explorer.py */
const CATS=[["all","Semua"],["doc","Dokumen"],["img","Gambar"],["data","Data"],
  ["pkg","Arsip/zip"],["code","Kode"],["office","Office"],["other","Lainnya"]];
const CATNAME={};for(const c of CATS)CATNAME[c[0]]=c[1];
const S={q:"",cat:"all",sort:{col:"mtime",dir:"desc"}};
const CHUNK=200;              /* render bertahap: 200 baris awal + "Muat lagi" */
let DATA=null,FLAT=[],shown=0,lastHash="",qT=null,toastT=null,lastFocus=null;

/* ================= olah data ================= */
function prepare(){FLAT=[];
  for(const r of DATA.roots)for(const f of r.files){
    f.root=r.label;f._p=r.path+"/"+f.rel;f._cat=f.type==="pdf"?"doc":f.type;FLAT.push(f)}
  if(S.cat!=="all"&&!FLAT.some(f=>f._cat===S.cat))S.cat="all"} /* degradasi anggun */

function filtered(){const q=S.q.toLowerCase();
  const out=FLAT.filter(f=>{
    if(S.cat!=="all"&&f._cat!==S.cat)return false;
    if(q&&!(f.rel+" "+(f.task?"task "+f.task:"")).toLowerCase().includes(q))return false;
    return true});
  const c=S.sort.col,m=S.sort.dir==="asc"?1:-1;
  out.sort((a,b)=>c==="size"?(a.size-b.size)*m:
    c==="name"?a.name.localeCompare(b.name,"id")*m:(a.mtime-b.mtime)*m);
  return out}
const findFile=k=>FLAT.find(f=>f.key===k)||null;

/* ================= render ================= */
function renderSide(){const n={all:FLAT.length};
  for(const f of FLAT)n[f._cat]=(n[f._cat]||0)+1;
  $("#side").innerHTML=CATS.filter(c=>c[0]==="all"||n[c[0]]>0) /* sembunyikan kategori kosong */
    .map(c=>'<button class="nav'+(S.cat===c[0]?" on":"")+'" data-cat="'+c[0]+
    '" aria-pressed="'+(S.cat===c[0])+'"><span>'+c[1]+'</span><span class="nc">'+(n[c[0]]||0)+
    "</span></button>").join("")}

function renderStats(){if(!DATA)return;const st=DATA.stats,sk=DATA.skill;
  const n=S.cat==="all"?FLAT.length:FLAT.filter(f=>f._cat===S.cat).length;
  let h='<div class="stat"><div class="k">Total file</div><div class="v">'+st.total_files+
    '</div><div class="s">lintas '+st.roots+' lokasi terpantau</div></div>'+
  '<div class="stat"><div class="k">Ukuran agregat</div><div class="v">'+fmtSize(st.total_size)+
    '</div><div class="s">download/ + archive/</div></div>'+
  '<div class="stat"><div class="k">Kategori aktif</div><div class="v vt">'+esc(CATNAME[S.cat]||"Semua")+
    '</div><div class="s">'+n+' file</div></div>';
  if(sk&&sk.installed){const heal=sk.heal_last?fmtRel(sk.heal_last):"belum pernah";
    h+='<div class="stat"><div class="k">Guardian</div><div class="v vt">v'+esc(sk.version||"?")+
      '</div><div class="s"><span class="dot'+(sk.watcher_alive?" on":"")+'"></span>watcher '+
      (sk.watcher_alive?"hidup":"mati")+" · heal "+heal+"</div></div>"}
  $("#stats").innerHTML=h}

function rowHTML(f){
  const i=f.rel.lastIndexOf("/"),dir=i<0?"":f.rel.slice(0,i);
  let bc=f.root+(dir?"/"+dir:"");                /* breadcrumb: label root + folder */
  const seg=bc.split("/");                        /* ringkas segmen tengah bila panjang */
  if(seg.length>4)bc=seg[0]+"/…/"+seg[seg.length-1];
  return '<tr class="row" data-key="'+esc(f.key)+'" tabindex="0" title="Pratinjau '+esc(f.name)+'">'+
'<td><span class="fn">'+esc(f.name)+'</span><span class="fd" title="'+esc(f.root+"/"+f.rel)+'">'+
  esc(bc)+'/</span></td>'+
'<td><span class="badge t-'+f._cat+'">'+esc(CATNAME[f._cat])+"</span></td>"+
'<td class="num">'+fmtSize(f.size)+"</td>"+
'<td class="tm" title="'+fmtDate(f.mtime)+'">'+fmtRel(f.mtime)+"</td>"+
'<td class="act"><button class="ibtn" data-copy="'+esc(f.key)+'" title="Salin path di server" aria-label="Salin path '+
  esc(f.name)+'">'+svg("copy")+'</button><button class="ibtn" data-prev="'+esc(f.key)+
  '" title="Pratinjau" aria-label="Pratinjau '+esc(f.name)+'">'+svg("eye")+"</button></td></tr>"}

function renderTable(){const tb=$("#tbody");
  if(!DATA){tb.innerHTML=strow('<div class="spin"></div>memuat inventaris file…');
    $("#moreWrap").hidden=true;return}
  const list=filtered();
  if(!list.length){const f=S.q||S.cat!=="all";
    tb.innerHTML=strow(svg(f?"search":"folder")+(f
      ?"Tidak ada file yang cocok — ubah kata kunci atau pilih kategori lain"
      :"Belum ada file di download/ dan archive/"));
    $("#moreWrap").hidden=true;return}
  if(!shown)shown=CHUNK;
  if(shown>list.length)shown=list.length;
  tb.innerHTML=list.slice(0,shown).map(rowHTML).join("");
  updateMore()}

function updateMore(){const w=$("#moreWrap");if(!DATA){w.hidden=true;return}
  const left=filtered().length-shown;
  w.hidden=left<=0;
  if(left>0)$("#moreBtn").textContent="Muat lagi · sisa "+left+" file"}

function renderError(){
  $("#tbody").innerHTML=strow(svg("warn")+
    'Gagal memuat data dari explorer.py — server tidak merespons.<br>'+
    '<button class="btn acc" id="retry">'+svg("refresh")+"Coba lagi</button>","err");
  $("#moreWrap").hidden=true;
  $("#retry").addEventListener("click",load)}

function updateSortUI(){$$("th[data-col]").forEach(th=>{const on=th.dataset.col===S.sort.col;
  th.setAttribute("aria-sort",on?(S.sort.dir==="asc"?"ascending":"descending"):"none");
  th.querySelector(".arr").textContent=on?(S.sort.dir==="asc"?"▲":"▼"):""})}

/* ================= aksi ================= */
async function copyPath(f){if(!f)return;
  const p=f._p;let ok=true;                      /* clipboard API + fallback execCommand */
  try{await navigator.clipboard.writeText(p)}
  catch(e1){try{const ta=document.createElement("textarea");ta.value=p;
      ta.style.cssText="position:fixed;top:0;opacity:0";
      document.body.appendChild(ta);ta.select();document.execCommand("copy");ta.remove()}
    catch(e2){ok=false}}
  toast(ok?"Path disalin — "+p:"Gagal menyalin path")}

function toast(m){const el=$("#toast");el.textContent=m;el.classList.add("show");
  clearTimeout(toastT);toastT=setTimeout(()=>el.classList.remove("show"),2600)}

function md(src){const out=[];let code=false,cb=[],list=false;   /* mini-markdown */
  const inl=t=>esc(t).replace(/\*\*(.+?)\*\*/g,"<b>$1</b>").replace(/\*(.+?)\*/g,"<i>$1</i>")
    .replace(/`([^`]+)`/g,"<code>$1</code>")
    .replace(/\[([^\]]+)\]\(([^)]+)\)/g,'<a href="$2" target="_blank" rel="noopener">$1</a>');
  for(const l of String(src).split("\n")){
    if(l.trim().startsWith("```")){
      if(code){out.push("<pre><code>"+esc(cb.join("\n"))+"</code></pre>");cb=[]}
      code=!code;continue}
    if(code){cb.push(l);continue}
    const h=l.match(/^(#{1,4})\s+(.*)/);
    if(h){if(list){out.push("</ul>");list=false}
      out.push("<h"+h[1].length+">"+inl(h[2])+"</h"+h[1].length+">");continue}
    const li=l.match(/^\s*[-*]\s+(.*)/);
    if(li){if(!list){out.push("<ul>");list=true}out.push("<li>"+inl(li[1])+"</li>");continue}
    if(list){out.push("</ul>");list=false}
    if(!l.trim())continue;
    out.push(l.trim().startsWith(">")?"<blockquote>"+inl(l.replace(/^\s*>\s?/,""))+"</blockquote>"
      :"<p>"+inl(l)+"</p>")}
  if(list)out.push("</ul>");
  if(code)out.push("<pre><code>"+esc(cb.join("\n"))+"</code></pre>");
  return out.join("\n")}

async function openPreview(f){if(!f)return;
  lastFocus=document.activeElement;
  $("#mName").textContent=f.root+"/"+f.rel;
  $("#mMeta").textContent=fmtSize(f.size)+" · "+fmtDate(f.mtime);
  const dl=$("#mDl");dl.href=f.href+"?dl=1";dl.setAttribute("download",f.name);
  $("#mCopy").onclick=()=>copyPath(f);
  const b=$("#mBody");b.innerHTML='<div class="st"><div class="spin"></div>memuat pratinjau…</div>';
  $("#modal").classList.add("open");$("#mClose").focus();
  const e=(f.ext||"").toLowerCase();
  try{
    if(f.type==="img"){b.innerHTML='<img src="'+esc(f.href)+'" alt="'+esc(f.name)+'">';return}
    if(e==="pdf"){b.innerHTML='<iframe src="'+esc(f.href)+'" title="Pratinjau PDF"></iframe>';return}
    if(f.type==="pkg"||f.type==="office"){   /* arsip & office: unduh, bukan pratinjau */
      b.innerHTML='<div class="st">'+svg("down")+"Format <b>"+esc((e||f.type).toUpperCase())+
        "</b> tidak dipratinjau langsung di browser.<br>Unduh lalu buka dengan aplikasi terkait.<br>"+
        '<a class="btn acc" href="'+esc(f.href)+'?dl=1" download="'+esc(f.name)+'">'+svg("down")+
        "Unduh "+esc(f.name)+"</a></div>";return}
    const t=await(await fetch(f.href,{cache:"no-store"})).text();
    if(e==="md"){b.innerHTML='<div class="mdv">'+md(t)+"</div>";return}
    if(e==="json"){let s=t;try{s=JSON.stringify(JSON.parse(t),null,2)}catch(_){}
      b.innerHTML="<pre>"+esc(s)+"</pre>";return}
    b.innerHTML="<pre>"+esc(t.slice(0,200000))+"</pre>";
  }catch(err){b.innerHTML=stInner(svg("warn")+"Gagal memuat pratinjau: "+esc(err.message),"err")}}
function stInner(h,cls){return '<div class="st '+(cls||"")+'">'+h+"</div>"}
function closeModal(){$("#modal").classList.remove("open");
  if(lastFocus&&lastFocus.focus)lastFocus.focus()}

/* ================= loop data ================= */
async function load(){try{
    const r=await fetch("/api/files",{cache:"no-store"});
    if(!r.ok)throw new Error("HTTP "+r.status);
    const d=await r.json(),h=JSON.stringify(d);
    if(h!==lastHash){lastHash=h;DATA=d;prepare();
      renderSide();renderStats();renderTable()}
    $("#ft").textContent="PID "+d.server.pid+" · port "+d.server.port+
      " · polling 10 dtk · diperbarui "+d.generated;
  }catch(e){
    $("#ft").textContent="koneksi ke explorer.py terputus — mencoba lagi otomatis tiap 10 dtk";
    if(!DATA)renderError();else toast("Koneksi ke explorer.py terputus")}}

/* ================= tema ================= */
function applyTheme(t,persist){document.documentElement.dataset.theme=t;
  const b=$("#themeBtn");b.innerHTML=svg(t==="dark"?"sun":"moon");
  b.title=t==="dark"?"Ganti ke tema terang":"Ganti ke tema gelap";
  b.setAttribute("aria-label",b.title);
  if(persist){try{localStorage.setItem("exp-theme",t)}catch(e){}}}

/* ================= wiring ================= */
function init(){
  applyTheme(document.documentElement.dataset.theme,false);
  $("#themeBtn").addEventListener("click",()=>
    applyTheme(document.documentElement.dataset.theme==="dark"?"light":"dark",true));
  try{const mq=window.matchMedia("(prefers-color-scheme: light)"); /* adaptif */
    mq.addEventListener("change",ev=>{let s=null;try{s=localStorage.getItem("exp-theme")}catch(_){}
      if(s!=="dark"&&s!=="light")applyTheme(ev.matches?"light":"dark",false)})}catch(_){}
  updateSortUI();

  /* pencarian live — debounce 200 ms (nama / ekstensi / ID task) */
  const q=$("#q");
  q.addEventListener("input",()=>{const v=q.value;$("#qClear").hidden=!v;
    clearTimeout(qT);qT=setTimeout(()=>{S.q=v.trim();shown=CHUNK;renderTable()},200)});
  $("#qClear").addEventListener("click",()=>{clearTimeout(qT);q.value="";
    $("#qClear").hidden=true;S.q="";shown=CHUNK;renderTable();q.focus()});

  /* sort: klik header kolom, klik lagi = balik arah */
  $("#thd").addEventListener("click",e=>{const th=e.target.closest("th[data-col]");if(!th)return;
    const c=th.dataset.col;
    if(S.sort.col===c)S.sort.dir=S.sort.dir==="asc"?"desc":"asc";
    else S.sort={col:c,dir:c==="mtime"?"desc":"asc"};
    shown=CHUNK;updateSortUI();renderTable()});

  /* filter kategori via sidebar/chip */
  $("#side").addEventListener("click",e=>{const b=e.target.closest("[data-cat]");if(!b)return;
    S.cat=b.dataset.cat;shown=CHUNK;renderSide();renderStats();renderTable()});

  /* delegasi event tabel: copy-path / pratinjau / klik baris */
  const tb=$("#tbody");
  tb.addEventListener("click",e=>{
    const cp=e.target.closest("[data-copy]");
    if(cp){copyPath(findFile(cp.dataset.copy));return}
    const pv=e.target.closest("[data-prev]");
    if(pv){openPreview(findFile(pv.dataset.prev));return}
    const r=e.target.closest("tr.row");
    if(r)openPreview(findFile(r.dataset.key))});
  tb.addEventListener("keydown",e=>{
    if(e.key!=="Enter"&&e.key!==" ")return;
    if(e.target.closest("button,a,input"))return;
    const r=e.target.closest("tr.row");
    if(r){e.preventDefault();openPreview(findFile(r.dataset.key))}});

  /* render bertahap: chunk berikutnya */
  $("#moreBtn").addEventListener("click",()=>{
    const list=filtered(),next=Math.min(shown+CHUNK,list.length);
    if(next>shown){tb.insertAdjacentHTML("beforeend",list.slice(shown,next).map(rowHTML).join(""));
      shown=next}
    updateMore()});

  /* dialog pratinjau */
  $("#mClose").addEventListener("click",closeModal);
  $("#modal").addEventListener("click",e=>{if(e.target.id==="modal")closeModal()});
  document.addEventListener("keydown",e=>{
    if(e.key==="Escape"&&$("#modal").classList.contains("open"))closeModal()});

  /* polling 10 dtk + refresh saat fokus */
  setInterval(load,10000);
  document.addEventListener("visibilitychange",()=>{if(!document.hidden)load()});
  load()}
document.addEventListener("DOMContentLoaded",init);
</script>
<style>
/* ================= token & tema ================= */
:root{color-scheme:light;
  --bg:#f2f5f6;--card:#fff;--card2:#f6f8f9;--line:#dbe2e5;--line2:#e9eef0;
  --tx:#1c2830;--tx2:#5c6d76;--tx3:#64757f;
  --acc:#0e7490;--accbg:#e3f3f7;--acctx:#0a5c73;
  --ok:#178a44;--bad:#bb2d21;
  --shadow:0 1px 2px rgba(28,40,48,.05),0 2px 10px rgba(28,40,48,.06)}
html[data-theme=dark]{color-scheme:dark;
  --bg:#0d1317;--card:#151d23;--card2:#1a242c;--line:#293640;--line2:#202b33;
  --tx:#e8eef2;--tx2:#a4b5be;--tx3:#7d909b;
  --acc:#3ec3db;--accbg:#0f313b;--acctx:#8adcec;
  --ok:#4fd487;--bad:#f0857c;
  --shadow:0 1px 3px rgba(0,0,0,.4)}

/* ================= dasar ================= */
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);
  font:14px/1.5 system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
  -webkit-font-smoothing:antialiased}
a{color:var(--acctx)}
.ic{width:16px;height:16px;fill:none;stroke:currentColor;stroke-width:2;
  stroke-linecap:round;stroke-linejoin:round;flex:none;vertical-align:-3px}
:focus-visible{outline:2px solid var(--acc);outline-offset:2px}

/* ================= header ================= */
.top{max-width:1180px;margin:0 auto;padding:16px 16px 12px;display:flex;
  align-items:center;gap:12px;flex-wrap:wrap}
.brand{display:flex;align-items:center;gap:11px;margin-right:auto}
.bic{width:36px;height:36px;border-radius:10px;background:var(--acc);color:#fff;
  display:grid;place-items:center}
.bic .ic{width:19px;height:19px;stroke-width:2.6}
html[data-theme=dark] .bic{color:#062730}
.brand h1{font-size:16px;margin:0;letter-spacing:-.01em}
.brand p{margin:0;font-size:12px;color:var(--tx2)}
.search{display:flex;align-items:center;gap:8px;flex:1;min-width:230px;max-width:430px;
  background:var(--card);border:1px solid var(--line);border-radius:10px;padding:6px 12px;
  box-shadow:var(--shadow)}
.search .ic{color:var(--tx3)}
.search input{flex:1;border:0;background:none;color:var(--tx);font:inherit;min-width:0}
.search input:focus{outline:none}
.search input::placeholder{color:var(--tx3)}

/* ================= tombol ================= */
.ibtn{display:inline-flex;align-items:center;justify-content:center;width:32px;height:32px;
  border-radius:8px;border:1px solid var(--line);background:var(--card);color:var(--tx2);
  cursor:pointer;padding:0;flex:none}
.ibtn:hover{color:var(--acctx);border-color:var(--acc);background:var(--accbg)}
.btn{display:inline-flex;align-items:center;gap:7px;padding:8px 15px;border-radius:9px;
  border:1px solid var(--line);background:var(--card);color:var(--tx);font:inherit;
  font-weight:600;cursor:pointer;text-decoration:none}
.btn:hover{border-color:var(--acc)}
.btn.acc{background:var(--acc);border-color:var(--acc);color:#fff}
html[data-theme=dark] .btn.acc{color:#062730}
.btn.acc:hover{filter:brightness(1.08)}

/* ================= layout: sidebar + main ================= */
.layout{max-width:1180px;margin:0 auto;padding:0 16px 24px;display:grid;
  grid-template-columns:196px minmax(0,1fr);gap:16px;align-items:start}
.side{position:sticky;top:14px;background:var(--card);border:1px solid var(--line);
  border-radius:12px;padding:8px;box-shadow:var(--shadow);display:flex;
  flex-direction:column;gap:2px}
.side:empty{display:none}
.stitle{font-size:10.5px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;
  color:var(--tx3);padding:6px 10px 4px}
.nav{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:7px 10px;
  border:0;background:none;border-radius:8px;color:var(--tx2);font:inherit;font-size:13.5px;
  cursor:pointer;text-align:left}
.nav:hover{background:var(--card2);color:var(--tx)}
.nav.on{background:var(--accbg);color:var(--acctx);font-weight:600}
.nc{font-size:11px;font-variant-numeric:tabular-nums;line-height:18px;padding:0 7px;
  border-radius:99px;background:var(--card2);border:1px solid var(--line);color:var(--tx2);flex:none}
.nav.on .nc{background:transparent;border-color:transparent;color:var(--acctx)}
@media(max-width:800px){   /* layar sempit: sidebar jadi chip horizontal scrollable */
  .layout{grid-template-columns:1fr;gap:12px}
  .side{position:static;flex-direction:row;overflow-x:auto;gap:6px;padding:6px}
  .stitle{display:none}
  .nav{flex:none;justify-content:center;border:1px solid var(--line);padding:6px 12px}
  .nc{border:0;background:none;padding:0}
}

/* ================= kartu statistik ================= */
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(165px,1fr));gap:12px;
  margin-bottom:16px}
.stats:empty{display:none}
.stat{background:var(--card);border:1px solid var(--line);border-radius:12px;
  padding:13px 16px 12px;box-shadow:var(--shadow)}
.stat .k{font-size:10.5px;font-weight:700;letter-spacing:.07em;text-transform:uppercase;
  color:var(--tx3)}
.stat .v{font-size:26px;font-weight:700;letter-spacing:-.02em;line-height:1.25;
  font-variant-numeric:tabular-nums;margin-top:3px}
.stat .v.vt{font-size:19px;line-height:1.55}
.stat .s{font-size:12px;color:var(--tx2);margin-top:3px;display:flex;align-items:center;
  gap:6px;flex-wrap:wrap}
.dot{width:8px;height:8px;border-radius:50%;background:var(--bad);flex:none}
.dot.on{background:var(--ok)}

/* ================= tabel file ================= */
.tblcard{background:var(--card);border:1px solid var(--line);border-radius:12px;
  box-shadow:var(--shadow);overflow:hidden}
.tw{overflow-x:auto}
table{width:100%;min-width:640px;border-collapse:collapse;font-size:13.5px}
thead th{background:var(--card2);font-size:10.5px;font-weight:700;letter-spacing:.06em;
  text-transform:uppercase;color:var(--tx2);text-align:left;padding:9px 14px;
  border-bottom:1px solid var(--line);white-space:nowrap}
th.num,td.num{text-align:right}
th.act,td.act{text-align:right}
th[data-col]{cursor:pointer;user-select:none}
th[data-col]:hover{color:var(--acctx)}
th .arr{font-size:9px;color:var(--acctx);margin-left:3px}
tbody td{padding:8px 14px;border-bottom:1px solid var(--line2);vertical-align:top}
tbody tr:last-child td{border-bottom:0}
tbody tr.row{cursor:pointer}
tbody tr.row:nth-child(even){background:var(--card2)}   /* zebra halus */
tbody tr.row:hover{background:var(--accbg)}
tbody tr.row:focus-visible{outline:2px solid var(--acc);outline-offset:-2px}
.fn{display:block;font-weight:600;max-width:440px;overflow:hidden;text-overflow:ellipsis;
  white-space:nowrap}
.fd{display:block;font-size:11.5px;color:var(--tx3);max-width:440px;overflow:hidden;
  text-overflow:ellipsis;white-space:nowrap;margin-top:1px}
td.num,td.tm{font-variant-numeric:tabular-nums;white-space:nowrap;color:var(--tx2)}
td.act{white-space:nowrap}
td.act .ibtn{width:28px;height:28px}

/* badge kategori */
.badge{display:inline-flex;align-items:center;gap:6px;font-size:11px;font-weight:600;
  padding:2.5px 9px;border-radius:99px;white-space:nowrap;color:var(--b);
  background:var(--card2);background:color-mix(in srgb,var(--b) 12%,transparent)}
.badge::before{content:"";width:6px;height:6px;border-radius:50%;background:currentColor;flex:none}
.t-doc{--b:#1d4ed8}.t-img{--b:#a21caf}.t-data{--b:#b45309}.t-pkg{--b:#c2410c}
.t-code{--b:#047857}.t-office{--b:#6d28d9}.t-other{--b:#475569}
html[data-theme=dark] .t-doc{--b:#8fb5ff}html[data-theme=dark] .t-img{--b:#df9bf2}
html[data-theme=dark] .t-data{--b:#e3c56d}html[data-theme=dark] .t-pkg{--b:#f5a06d}
html[data-theme=dark] .t-code{--b:#5bd6a4}html[data-theme=dark] .t-office{--b:#b8a4ff}
html[data-theme=dark] .t-other{--b:#9aa9b5}

/* state loading / kosong / error */
.st{padding:42px 18px;display:flex;flex-direction:column;align-items:center;gap:11px;
  text-align:center;color:var(--tx2);font-size:13.5px}
.st .ic{width:26px;height:26px;color:var(--tx3)}
.st.err{color:var(--bad)}
.st.err .ic{color:var(--bad)}
.spin{width:22px;height:22px;border-radius:50%;border:2.5px solid var(--line);
  border-top-color:var(--acc);animation:rot .8s linear infinite}
@keyframes rot{to{transform:rotate(360deg)}}
.morewrap{display:flex;justify-content:center;padding:12px;border-top:1px solid var(--line2)}
.morewrap[hidden]{display:none}

footer{max-width:1180px;margin:0 auto;padding:0 16px 28px;font-size:12px;color:var(--tx3)}

/* ================= dialog pratinjau ================= */
.modal{position:fixed;inset:0;z-index:50;display:none;align-items:center;justify-content:center;
  padding:18px;background:rgba(5,12,16,.58)}
html[data-theme=dark] .modal{background:rgba(0,0,0,.62)}
.modal.open{display:flex}
.mbox{background:var(--card);border:1px solid var(--line);border-radius:14px;
  width:min(900px,100%);max-height:min(88vh,780px);display:flex;flex-direction:column;
  box-shadow:0 24px 60px rgba(0,0,0,.3);overflow:hidden}
.mhead{display:flex;align-items:center;gap:8px;padding:11px 14px;
  border-bottom:1px solid var(--line);flex-wrap:wrap}
.mtxt{margin-right:auto;min-width:180px}
#mName{font-weight:700;font-size:13.5px;word-break:break-all;line-height:1.35}
#mMeta{font-size:12px;color:var(--tx2)}
.mbody{overflow:auto;padding:18px;flex:1}
.mbody img{max-width:100%;height:auto;display:block;margin:0 auto;border-radius:8px}
.mbody iframe{width:100%;height:72vh;border:0;border-radius:8px;background:#fff}
.mbody pre{margin:0;font:12px/1.65 ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
  white-space:pre-wrap;word-break:break-word}
.mdv{font-size:14px;line-height:1.65;max-width:780px}
.mdv h1,.mdv h2,.mdv h3,.mdv h4{margin:1.1em 0 .4em;line-height:1.3}
.mdv h1{font-size:1.5em}.mdv h2{font-size:1.28em}.mdv h3{font-size:1.12em}
.mdv p,.mdv ul{margin:.5em 0}
.mdv ul{padding-left:1.4em}
.mdv code{background:var(--card2);border:1px solid var(--line2);border-radius:4px;padding:0 4px;
  font:12px ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}
.mdv pre{background:var(--card2);border:1px solid var(--line2);border-radius:8px;
  padding:12px 14px;overflow:auto}
.mdv pre code{border:0;background:none;padding:0;font-size:12px}
.mdv blockquote{margin:.6em 0;padding:.1em .95em;border-left:3px solid var(--acc);color:var(--tx2)}

/* toast */
#toast{position:fixed;left:50%;bottom:22px;z-index:60;transform:translate(-50%,14px);
  background:var(--tx);color:var(--bg);padding:9px 16px;border-radius:9px;font-size:13px;
  font-weight:500;max-width:88vw;opacity:0;pointer-events:none;
  transition:opacity .2s,transform .2s;box-shadow:0 8px 28px rgba(0,0,0,.28);word-break:break-all}
#toast.show{opacity:1;transform:translate(-50%,0)}
</style>
</head>
<body>

<!-- Pustaka ikon SVG inline (zero-dependency, tanpa aset eksternal) -->
<svg width="0" height="0" style="position:absolute" aria-hidden="true">
  <symbol id="i-search" viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path d="M16.5 16.5 21 21"/></symbol>
  <symbol id="i-copy" viewBox="0 0 24 24"><rect x="9" y="9" width="11" height="11" rx="2"/><path d="M5 15V6a2 2 0 0 1 2-2h9"/></symbol>
  <symbol id="i-eye" viewBox="0 0 24 24"><path d="M2 12s3.5-6.5 10-6.5S22 12 22 12s-3.5 6.5-10 6.5S2 12 2 12z"/><circle cx="12" cy="12" r="2.8"/></symbol>
  <symbol id="i-down" viewBox="0 0 24 24"><path d="M12 4v11m-4.5-4.5L12 15l4.5-4.5M4.5 20h15"/></symbol>
  <symbol id="i-sun" viewBox="0 0 24 24"><circle cx="12" cy="12" r="4"/><path d="M12 2.5v2m0 15v2M2.5 12h2m15 0h2M5.3 5.3l1.4 1.4m10.6 10.6 1.4 1.4M18.7 5.3l-1.4 1.4M6.7 17.3l-1.4 1.4"/></symbol>
  <symbol id="i-moon" viewBox="0 0 24 24"><path d="M20.6 14.4A8.7 8.7 0 1 1 9.6 3.4a7 7 0 0 0 11 11z"/></symbol>
  <symbol id="i-close" viewBox="0 0 24 24"><path d="M6 6l12 12M18 6 6 18"/></symbol>
  <symbol id="i-warn" viewBox="0 0 24 24"><path d="M12 3.5 22 20H2z"/><path d="M12 10v4.5M12 17.6v.01"/></symbol>
  <symbol id="i-folder" viewBox="0 0 24 24"><path d="M3 7a2 2 0 0 1 2-2h4l2 2.5h8a2 2 0 0 1 2 2V17a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/></symbol>
  <symbol id="i-refresh" viewBox="0 0 24 24"><path d="M20 12a8 8 0 1 1-2.6-5.9L20 8.5"/><path d="M20 3.5v5h-5"/></symbol>
  <symbol id="i-logo" viewBox="0 0 24 24"><path d="M4 12.5l5 5L20 6.5"/></symbol>
</svg>

<header class="top">
  <div class="brand">
    <span class="bic"><svg class="ic"><use href="#i-logo"/></svg></span>
    <div><h1>File Explorer</h1><p>dashboard file · download/ · archive/</p></div>
  </div>
  <div class="search" role="search">
    <svg class="ic" aria-hidden="true"><use href="#i-search"/></svg>
    <input id="q" type="search" placeholder="Cari nama / ekstensi / ID task…" aria-label="Cari file">
    <button class="ibtn" id="qClear" hidden title="Bersihkan pencarian" aria-label="Bersihkan pencarian"><svg class="ic" aria-hidden="true"><use href="#i-close"/></svg></button>
  </div>
  <button class="ibtn" id="themeBtn" aria-label="Ganti tema"></button>
</header>

<div class="layout">
  <nav class="side" id="side" aria-label="Filter kategori"></nav>
  <main>
    <section class="stats" id="stats" aria-label="Ringkasan statistik"></section>
    <section class="tblcard" aria-label="Daftar file">
      <div class="tw">
        <table>
          <thead id="thd"><tr>
            <th data-col="name" scope="col" aria-sort="none" title="Urutkan berdasar nama — klik lagi untuk balik arah">Nama <span class="arr" aria-hidden="true"></span></th>
            <th scope="col">Kategori</th>
            <th data-col="size" scope="col" class="num" aria-sort="none" title="Urutkan berdasar ukuran — klik lagi untuk balik arah">Ukuran <span class="arr" aria-hidden="true"></span></th>
            <th data-col="mtime" scope="col" aria-sort="descending" title="Urutkan berdasar waktu — klik lagi untuk balik arah">Waktu <span class="arr" aria-hidden="true">▼</span></th>
            <th scope="col" class="act">Aksi</th>
          </tr></thead>
          <tbody id="tbody">
            <tr class="staterow"><td colspan="5"><div class="st"><div class="spin"></div>memuat inventaris file…</div></td></tr>
          </tbody>
        </table>
      </div>
      <div class="morewrap" id="moreWrap" hidden><button class="btn" id="moreBtn">Muat lagi</button></div>
    </section>
  </main>
</div>

<footer>Dilayani oleh <b>explorer.py</b> · UI Dashboard v4.0 · zero-dependency · tema adaptif · <span id="ft">menghubungi server…</span></footer>

<!-- Dialog pratinjau file -->
<div class="modal" id="modal" role="dialog" aria-modal="true" aria-labelledby="mName">
  <div class="mbox">
    <div class="mhead">
      <div class="mtxt"><div id="mName"></div><span id="mMeta"></span></div>
      <button class="ibtn" id="mCopy" title="Salin path file di server" aria-label="Salin path file di server"><svg class="ic" aria-hidden="true"><use href="#i-copy"/></svg></button>
      <a class="btn acc" id="mDl" download><svg class="ic" aria-hidden="true"><use href="#i-down"/></svg>Unduh</a>
      <button class="ibtn" id="mClose" title="Tutup pratinjau" aria-label="Tutup pratinjau"><svg class="ic" aria-hidden="true"><use href="#i-close"/></svg></button>
    </div>
    <div class="mbody" id="mBody"></div>
  </div>
</div>

<div id="toast" role="status" aria-live="polite"></div>
</body>
</html>
